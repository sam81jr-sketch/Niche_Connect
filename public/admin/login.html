<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusChat Admin Login</title>

    <link
        rel="stylesheet"
        href="/admin/admin.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>CampusChat</h1>

            <h2>Admin Login</h2>

            <form id="adminLoginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Admin username"
                    autocomplete="username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Admin password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                >
                    Login
                </button>

            </form>

            <p id="error"></p>

        </div>

    </div>


    <script src="/admin/admin-login.js"></script>

</body>

</html>
