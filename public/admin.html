<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NICHE Connect — Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f1f5f9;
    color: #0f172a;
}


/* ================================
   HEADER
================================ */

header {
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    background: white;

    border-bottom: 1px solid #e2e8f0;

    position: sticky;
    top: 0;

    z-index: 20;
}

header h2 {
    margin: 0;

    font-size: 20px;
}

header span {
    font-size: 12px;
    color: #64748b;
}

#logoutButton {
    border: none;

    padding: 10px 15px;

    border-radius: 10px;

    background: #fee2e2;

    color: #dc2626;

    cursor: pointer;
}


/* ================================
   PAGE
================================ */

.container {
    width: 100%;
    max-width: 1100px;

    margin: auto;

    padding: 20px;
}


/* ================================
   STATS
================================ */

.stats {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 12px;

    margin-bottom: 20px;
}

.stat {
    background: white;

    padding: 18px;

    border-radius: 16px;

    border: 1px solid #e2e8f0;

    box-shadow:
        0 4px 15px
        rgba(15, 23, 42, 0.04);
}

.statLabel {
    font-size: 12px;

    color: #64748b;
}

.statValue {
    margin-top: 5px;

    font-size: 25px;

    font-weight: 750;
}


/* ================================
   SECTION
================================ */

.section {
    background: white;

    border: 1px solid #e2e8f0;

    border-radius: 18px;

    overflow: hidden;

    margin-bottom: 20px;
}

.sectionHeader {
    padding: 16px 18px;

    border-bottom: 1px solid #e2e8f0;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.sectionHeader h3 {
    margin: 0;
}

.refreshButton {
    border: none;

    padding: 9px 13px;

    border-radius: 9px;

    background: #eef2ff;

    color: #4f46e5;

    cursor: pointer;
}


/* ================================
   ROOMS
================================ */

#rooms {
    display: flex;

    flex-direction: column;
}


.room {
    padding: 16px 18px;

    border-bottom: 1px solid #f1f5f9;

    cursor: pointer;

    transition: 0.15s;
}

.room:hover {
    background: #f8fafc;
}

.room:last-child {
    border-bottom: none;
}

.roomUsers {
    display: flex;

    align-items: center;

    gap: 8px;

    font-weight: 700;
}

.user {
    background: #eef2ff;

    color: #4338ca;

    padding: 6px 9px;

    border-radius: 8px;

    font-size: 13px;
}

.arrow {
    color: #94a3b8;
}

.roomInfo {
    display: flex;

    gap: 12px;

    margin-top: 8px;

    font-size: 11px;

    color: #64748b;
}

.active {
    color: #16a34a;

    font-weight: 700;
}

.callActive {
    color: #2563eb;

    font-weight: 700;
}


/* ================================
   EMPTY
================================ */

.empty {
    padding: 40px;

    text-align: center;

    color: #64748b;
}


/* ================================
   CHAT VIEW
================================ */

#chatView {
    display: none;

    position: fixed;

    inset: 0;

    background: #f1f5f9;

    z-index: 100;
}


.chatHeader {
    height: 70px;

    background: white;

    border-bottom: 1px solid #e2e8f0;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 0 15px;
}

.backButton {
    width: 42px;
    height: 42px;

    border: none;

    border-radius: 12px;

    background: #f1f5f9;

    font-size: 20px;

    cursor: pointer;
}

.chatTitle {
    min-width: 0;
}

.chatTitle strong {
    display: block;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.chatTitle span {
    font-size: 11px;

    color: #64748b;
}


#chatMessages {
    height: calc(100dvh - 70px);

    overflow-y: auto;

    padding: 18px;

    display: flex;

    flex-direction: column;

    gap: 10px;
}


.adminMessage {
    max-width: 80%;

    padding: 10px 13px;

    border-radius: 15px;

    background: white;

    box-shadow:
        0 2px 7px
        rgba(0, 0, 0, 0.04);

    align-self: flex-start;
}

.adminMessage.right {
    align-self: flex-end;

    background: #6366f1;

    color: white;
}

.adminMessageName {
    font-size: 11px;

    font-weight: 700;

    margin-bottom: 4px;

    color: #6366f1;
}

.right .adminMessageName {
    color: rgba(255,255,255,.8);
}

.adminMessageText {
    word-break: break-word;

    line-height: 1.45;
}

.adminMessageTime {
    margin-top: 4px;

    font-size: 9px;

    opacity: .6;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 800px) {

    .stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

}


@media (max-width: 500px) {

    header {
        padding: 0 12px;
    }

    header h2 {
        font-size: 16px;
    }

    .container {
        padding: 12px;
    }

    .stats {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 8px;
    }

    .stat {
        padding: 13px;
    }

    .statValue {
        font-size: 21px;
    }

    #chatMessages {
        padding: 12px;
    }

}

</style>

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header>

    <div>

        <h2>
            🎓 NICHE Connect
        </h2>

        <span>
            Administration Panel
        </span>

    </div>


    <button
        id="logoutButton"
        onclick="logout()"
    >
        Logout
    </button>

</header>



<div class="container">


    <!-- ============================
         STATISTICS
    ============================= -->

    <div class="stats">

        <div class="stat">

            <div class="statLabel">
                Users
            </div>

            <div
                class="statValue"
                id="totalUsers"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Messages
            </div>

            <div
                class="statValue"
                id="totalMessages"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Private Rooms
            </div>

            <div
                class="statValue"
                id="totalRooms"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Active Chats
            </div>

            <div
                class="statValue"
                id="activeRooms"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="statLabel">
                Video Calls
            </div>

            <div
                class="statValue"
                id="activeCalls"
            >
                0
            </div>

        </div>

    </div>



    <!-- ============================
         PRIVATE ROOMS
    ============================= -->

    <div class="section">

        <div class="sectionHeader">

            <h3>
                💬 Private Chat Rooms
            </h3>

            <button
                class="refreshButton"
                onclick="loadRooms()"
            >
                ↻ Refresh
            </button>

        </div>


        <div id="rooms">

            <div class="empty">
                Loading rooms...
            </div>

        </div>

    </div>

</div>



<!-- ================================
     CHAT VIEW
================================ -->

<div id="chatView">


    <div class="chatHeader">

        <button
            class="backButton"
            onclick="closeChat()"
        >
            ←
        </button>


        <div class="chatTitle">

            <strong id="chatUsers">
                Private Chat
            </strong>

            <span>
                Admin read-only view
            </span>

        </div>

    </div>


    <div id="chatMessages">

        <div class="empty">
            Loading messages...
        </div>

    </div>

</div>



<script>


// ==========================================
// ADMIN TOKEN
// ==========================================

const adminToken =
    localStorage.getItem(
        "campuschat_admin_token"
    );


if (!adminToken) {

    window.location.href =
        "/adminlogin.html";

}


// ==========================================
// API HELPER
// ==========================================

async function adminFetch(
    url,
    options = {}
) {

    options.headers = {

        ...(options.headers || {}),

        "Authorization":
            "Bearer " +
            adminToken,

        "Content-Type":
            "application/json"

    };


    const response =
        await fetch(
            url,
            options
        );


    if (
        response.status === 401 ||
        response.status === 403
    ) {

        localStorage.removeItem(
            "campuschat_admin_token"
        );

        window.location.href =
            "/adminlogin.html";

        return null;

    }


    return response;

}


// ==========================================
// LOAD STATISTICS
// ==========================================

async function loadStats() {

    try {

        const response =
            await adminFetch(
                "/api/admin/stats"
            );


        if (!response) {
            return;
        }


        const result =
            await response.json();


        if (!result.success) {
            return;
        }


        const stats =
            result.stats;


        document.getElementById(
            "totalUsers"
        ).textContent =
            stats.totalUsers || 0;


        document.getElementById(
            "totalMessages"
        ).textContent =
            stats.totalMessages || 0;


        document.getElementById(
            "totalRooms"
        ).textContent =
            stats.totalRooms || 0;


        document.getElementById(
            "activeRooms"
        ).textContent =
            stats.activeRooms || 0;


        document.getElementById(
            "activeCalls"
        ).textContent =
            stats.activeVideoCalls || 0;


    } catch (error) {

        console.error(
            "Stats error:",
            error
        );

    }

}


// ==========================================
// LOAD ROOMS
// ==========================================

async function loadRooms() {

    const container =
        document.getElementById(
            "rooms"
        );


    container.innerHTML = `
        <div class="empty">
            Loading rooms...
        </div>
    `;


    try {

        const response =
            await adminFetch(
                "/api/admin/rooms"
            );


        if (!response) {
            return;
        }


        const result =
            await response.json();


        if (!result.success) {

            container.innerHTML = `
                <div class="empty">
                    Unable to load rooms.
                </div>
            `;

            return;

        }


        if (
            !result.rooms ||
            result.rooms.length === 0
        ) {

            container.innerHTML = `
                <div class="empty">
                    No private chat rooms yet.
                </div>
            `;

            return;

        }


        container.innerHTML = "";


        result.rooms.forEach(
            room => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "room";


                const status =
                    room.active
                        ? "● Active"
                        : "Ended";


                const statusClass =
                    room.active
                        ? "active"
                        : "";


                const call =
                    room.videoCallActive
                        ? `<span class="callActive">📹 Video call</span>`
                        : "";


                element.innerHTML = `

                    <div class="roomUsers">

                        <span class="user">
                            ${escapeHtml(
                                room.user1.username
                            )}
                        </span>

                        <span class="arrow">
                            ↔
                        </span>

                        <span class="user">
                            ${escapeHtml(
                                room.user2.username
                            )}
                        </span>

                    </div>


                    <div class="roomInfo">

                        <span class="${statusClass}">
                            ${status}
                        </span>

                        <span>
                            💬 ${room.messageCount}
                        </span>

                        ${call}

                    </div>

                `;


                element.onclick =
                    () => openRoom(
                        room.id
                    );


                container.appendChild(
                    element
                );

            }
        );


    } catch (error) {

        console.error(
            "Rooms error:",
            error
        );


        container.innerHTML = `
            <div class="empty">
                Unable to connect to server.
            </div>
        `;

    }

}


// ==========================================
// OPEN ROOM
// ==========================================

async function openRoom(
    roomId
) {

    const chatView =
        document.getElementById(
            "chatView"
        );


    const messages =
        document.getElementById(
            "chatMessages"
        );


    chatView.style.display =
        "block";


    messages.innerHTML = `
        <div class="empty">
            Loading messages...
        </div>
    `;


    try {

        const response =
            await adminFetch(
                "/api/admin/rooms/" +
                encodeURIComponent(
                    roomId
                ) +
                "/messages"
            );


        if (!response) {
            return;
        }


        const result =
            await response.json();


        if (!result.success) {

            messages.innerHTML = `
                <div class="empty">
                    Unable to load messages.
                </div>
            `;

            return;

        }


        const users =
            result.users || [];


        document.getElementById(
            "chatUsers"
        ).textContent =

            users.length >= 2

                ? users[0].username +
                  " ↔ " +
                  users[1].username

                : "Private Chat";


        messages.innerHTML = "";


        if (
            !result.messages ||
            result.messages.length === 0
        ) {

            messages.innerHTML = `
                <div class="empty">
                    No messages in this room.
                </div>
            `;

            return;

        }


        result.messages.forEach(
            message => {

                const element =
                    document.createElement(
                        "div"
                    );


                const firstUser =
                    users[0];


                const isSecondUser =
                    firstUser &&
                    String(
                        message.userId
                    ) !==
                    String(
                        firstUser.id
                    );


                element.className =
                    "adminMessage" +
                    (
                        isSecondUser
                            ? " right"
                            : ""
                    );


                const username =
                    message.username ||
                    "User";


                const time =
                    message.time
                        ? new Date(
                            message.time
                          ).toLocaleString()
                        : "";


                element.innerHTML = `

                    <div
                        class="adminMessageName"
                    >
                        ${escapeHtml(
                            username
                        )}
                    </div>

                    <div
                        class="adminMessageText"
                    >
                        ${escapeHtml(
                            message.message ||
                            ""
                        )}
                    </div>

                    <div
                        class="adminMessageTime"
                    >
                        ${escapeHtml(
                            time
                        )}
                    </div>

                `;


                messages.appendChild(
                    element
                );

            }
        );


        messages.scrollTop =
            messages.scrollHeight;


    } catch (error) {

        console.error(
            "Open room error:",
            error
        );


        messages.innerHTML = `
            <div class="empty">
                Unable to load chat.
            </div>
        `;

    }

}


// ==========================================
// CLOSE CHAT
// ==========================================

function closeChat() {

    document.getElementById(
        "chatView"
    ).style.display =
        "none";

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;

}


// ==========================================
// LOGOUT
// ==========================================

function logout() {

    localStorage.removeItem(
        "campuschat_admin_token"
    );

    window.location.href =
        "/admin/login.html";

}


// ==========================================
// START
// ==========================================

loadStats();

loadRooms();


// Refresh every 10 seconds

setInterval(
    () => {

        loadStats();
        loadRooms();

    },
    10000
);

</script>


</body>

</html>
